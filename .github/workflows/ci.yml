name: Verify CloudShield
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify
      - run: python -m json.tool infra/azure/main.json > /dev/null
      - run: python scripts/check-function-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudshield-jars
          path: |
            web/target/cloudshield-web-1.0.0.jar
            worker/target/azure-functions/cloudshield-worker/
