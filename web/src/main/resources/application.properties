spring.application.name=CloudShield
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Google returns via a top-level GET; Lax preserves its state/nonce session.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=always
logging.level.root=WARN
logging.level.edu.gla.cloudshield=INFO
spring.main.banner-mode=off
server.forward-headers-strategy=framework
